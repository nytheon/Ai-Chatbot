<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot - Free Online ChatGPT Without API Keys</title>
  <meta name="description" content="A free, keyless AI chatbot that runs right in your browser. Chat with a real language model online - no API key, no signup, no backend. HTML, CSS & JavaScript." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="avatar">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div class="brand-text">
          <h1>AI Chatbot</h1>
          <span class="status"><span class="status-dot"></span> Online - no API key needed</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="newChat" class="icon-btn" title="New chat" aria-label="Start a new chat"><i class="fa-solid fa-plus"></i></button>
        <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Open settings"><i class="fa-solid fa-gear"></i></button>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite"></main>

    <div class="composer-wrap">
      <div id="suggestions" class="suggestions"></div>
      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Ask me anything..." aria-label="Message"></textarea>
        <button id="send" type="submit" class="send-btn" aria-label="Send message"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
      <p class="disclaimer">Powered by a free keyless LLM endpoint. Responses are AI-generated - verify important info.</p>
    </div>
  </div>

  <div id="settings" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="closeSettings" class="icon-btn" aria-label="Close settings"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="modal-note">This chatbot calls an OpenAI-compatible chat completions API with no API key required. You can point it at any compatible endpoint.</p>
      <label for="apiUrl">API URL</label>
      <input id="apiUrl" type="url" spellcheck="false" />
      <label for="model">Model</label>
      <input id="model" type="text" spellcheck="false" />
      <label for="systemPrompt">System prompt</label>
      <textarea id="systemPrompt" rows="4" spellcheck="false"></textarea>
      <div class="modal-actions">
        <button id="resetSettings" class="btn ghost">Reset</button>
        <button id="saveSettings" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
